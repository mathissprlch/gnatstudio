name: Build Zed GNAT (macOS)

on:
  push:
    branches:
      - master
      - 'claude/add-gnat-tooling-zed-**'
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  pull_request:
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Zed release channel'
        type: choice
        default: 'stable'
        options: [stable, preview, nightly, dev]

concurrency:
  group: zed-gnat-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .app (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14   # Apple Silicon
          - target: x86_64-apple-darwin
            runner: macos-13   # Intel
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
      TOOLCHAIN_DIR: ${{ github.workspace }}/zed-fork/build/toolchain
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # Subtree commits aren't reachable from a shallow clone; need the
          # full history so the build step (and any future subtree push) has
          # everything it needs.
          fetch-depth: 0

      - name: Install build tooling
        run: |
          brew update
          # foundationdb is only needed by Zed's collab server, not the
          # editor we're packaging; skip it. cmake/ninja/pkg-config/rsync
          # are required by Zed's build; python@3.12 is for our LSP shims
          # and for RecordFlux's venv.
          brew install cmake ninja pkg-config python@3.12 rsync

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed-fork/zed/target
          key: zed-cargo-${{ matrix.target }}-${{ hashFiles('zed-fork/zed/Cargo.lock') }}
          restore-keys: zed-cargo-${{ matrix.target }}-

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: zed-fork/build/toolchain
          key: gnat-toolchain-${{ matrix.target }}-${{ hashFiles('zed-fork/scripts/provision-toolchain.sh') }}

      - name: Stage GNAT toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: zed-fork
        run: make toolchain

      - name: Build Zed GNAT.app
        working-directory: zed-fork
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:         ${{ secrets.APPLE_ID }}
          APPLE_PASS:       ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: make app

      - name: Archive .app for upload
        working-directory: zed-fork
        run: |
          shopt -s nullglob
          BUNDLE_DIR="zed/target/${TARGET_TRIPLE}/release/bundle/osx"
          cd "$BUNDLE_DIR"
          for app in *.app; do
            tar -czf "${app}.tar.gz" "$app"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-gnat-${{ matrix.target }}
          path: |
            zed-fork/zed/target/${{ matrix.target }}/release/bundle/osx/*.tar.gz
            zed-fork/zed/target/${{ matrix.target }}/release/bundle/osx/*.dmg
          if-no-files-found: error
          retention-days: 14
