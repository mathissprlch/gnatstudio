name: Build Zed GNAT (macOS)

on:
  push:
    branches:
      - master
      - 'claude/add-gnat-tooling-zed-**'
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  pull_request:
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Zed release channel'
        type: choice
        default: 'stable'
        options: [stable, preview, nightly, dev]

# Cancel superseded runs only on PRs; on push to a tracked branch let each
# attempt finish so the failure log step actually fires.
concurrency:
  group: zed-gnat-mac-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write   # for the failure log → PR comment step

jobs:
  build:
    name: Build .app (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14   # Apple Silicon
          - target: x86_64-apple-darwin
            runner: macos-13   # Intel
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
      TOOLCHAIN_DIR: ${{ github.workspace }}/zed-fork/build/toolchain
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
      BUILD_LOG: ${{ github.workspace }}/zed-fork/build/build.log

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # subtree commits aren't reachable from a shallow clone

      - name: Install build tooling
        run: |
          brew update
          brew install cmake ninja pkg-config python@3.12 rsync

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed-fork/zed/target
          key: zed-cargo-${{ matrix.target }}-${{ hashFiles('zed-fork/zed/Cargo.lock') }}
          restore-keys: zed-cargo-${{ matrix.target }}-

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: zed-fork/build/toolchain
          key: gnat-toolchain-${{ matrix.target }}-${{ hashFiles('zed-fork/scripts/provision-toolchain.sh') }}

      - name: Stage GNAT toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: zed-fork
        run: |
          mkdir -p build
          make toolchain 2>&1 | tee -a "$BUILD_LOG"

      - name: Build Zed GNAT.app
        id: build_app
        working-directory: zed-fork
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:         ${{ secrets.APPLE_ID }}
          APPLE_PASS:       ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          set -o pipefail
          make app 2>&1 | tee -a "$BUILD_LOG"

      - name: Surface build failure
        if: failure() && steps.build_app.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p zed-fork/build
          : > zed-fork/build/failure.md
          {
            echo "### CI failure — \`${{ matrix.target }}\` (${{ github.event_name }})"
            echo
            echo "Step: \`Build Zed GNAT.app\`"
            echo "Run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Last 200 lines of build log:"
            echo
            echo '```'
            tail -n 200 "$BUILD_LOG" 2>/dev/null || echo "(no build log captured)"
            echo '```'
          } > zed-fork/build/failure.md
          cat zed-fork/build/failure.md

          # Only post on pull_request events (we need a PR number)
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            # Push-event runs: look up an open PR for this head ref.
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
                          --head "${{ github.ref_name }}" \
                          --state open --json number --jq '.[0].number // empty')
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body-file zed-fork/build/failure.md
            echo "Posted failure log to PR #$PR_NUMBER"
          else
            echo "No open PR for ${{ github.ref_name }}; skipping comment"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: zed-fork/build/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive .app for upload
        if: steps.build_app.conclusion == 'success'
        working-directory: zed-fork
        run: |
          shopt -s nullglob
          BUNDLE_DIR="zed/target/${TARGET_TRIPLE}/release/bundle/osx"
          cd "$BUNDLE_DIR"
          for app in *.app; do
            tar -czf "${app}.tar.gz" "$app"
          done
          ls -la

      - name: Upload artifact
        if: steps.build_app.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zed-gnat-${{ matrix.target }}
          path: |
            zed-fork/zed/target/${{ matrix.target }}/release/bundle/osx/*.tar.gz
            zed-fork/zed/target/${{ matrix.target }}/release/bundle/osx/*.dmg
          if-no-files-found: error
          retention-days: 14
