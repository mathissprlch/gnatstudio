name: Build Zed GNAT (macOS)

on:
  push:
    branches:
      - master
      - 'claude/add-gnat-tooling-zed-**'
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  pull_request:
    paths:
      - 'zed-fork/**'
      - '.github/workflows/zed-gnat-mac.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Zed release channel'
        type: choice
        default: 'stable'
        options: [stable, preview, nightly, dev]
      target_triple:
        description: 'Target triple'
        type: choice
        default: 'aarch64-apple-darwin'
        options: [aarch64-apple-darwin, x86_64-apple-darwin]

concurrency:
  group: zed-gnat-mac-${{ github.ref }}-${{ github.event.inputs.target_triple || 'host' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .app (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14   # Apple Silicon
          - target: x86_64-apple-darwin
            runner: macos-13   # Intel
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'stable' }}
      TOOLCHAIN_DIR: ${{ github.workspace }}/zed-fork/build/toolchain
      # Zed itself needs >= 1.85; pinned via rust-toolchain.toml inside Zed.
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          brew update
          brew install cmake ninja foundationdb pkg-config python@3.12 rsync || true
          # cargo-bundle (zed's fork) is installed on demand by bundle-mac.

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed-fork/vendor/zed/target
          key: zed-cargo-${{ matrix.target }}-${{ hashFiles('zed-fork/zed.pin', 'zed-fork/patches/**') }}
          restore-keys: zed-cargo-${{ matrix.target }}-

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: zed-fork/build/toolchain
          key: gnat-toolchain-${{ matrix.target }}-${{ hashFiles('zed-fork/scripts/provision-toolchain.sh') }}

      - name: Fetch Zed source
        working-directory: zed-fork
        run: make fetch

      - name: Apply patches + bundle extension
        working-directory: zed-fork
        run: make patch

      - name: Stage GNAT toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: zed-fork
        run: make toolchain

      - name: Build Zed GNAT.app
        working-directory: zed-fork
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:         ${{ secrets.APPLE_ID }}
          APPLE_PASS:       ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: make app

      - name: Archive .app for upload
        working-directory: zed-fork
        run: |
          shopt -s nullglob
          BUNDLE_DIR="vendor/zed/target/${TARGET_TRIPLE}/release/bundle/osx"
          cd "$BUNDLE_DIR"
          for app in *.app; do
            tar -czf "${app}.tar.gz" "$app"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-gnat-${{ matrix.target }}
          path: |
            zed-fork/vendor/zed/target/${{ matrix.target }}/release/bundle/osx/*.tar.gz
            zed-fork/vendor/zed/target/${{ matrix.target }}/release/bundle/osx/*.dmg
          if-no-files-found: error
          retention-days: 14
