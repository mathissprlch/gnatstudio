name: Build LLDB (Ada) — macOS

# Builds a liblldb carrying the Ada type-system patches (zed-fork/patches) on a
# native arm64 macOS runner. This is the authoritative build that the Linux dev
# box cannot do; it is also where we iterate on the patches.
#
# Heads-up on resources: a full llvm+clang+lldb build needs ~18-20 GB of disk
# and, on the 3-core GitHub-hosted macos-14 runner, a couple of hours cold.
# Two caches keep iteration cheap:
#   * the *built* liblldb, keyed on the patch set + pin -> unchanged patches
#     skip the build entirely;
#   * ccache, so a patch change recompiles only TypeSystemClang.cpp + deps.
# The build step traces every command (set -x) into a log and, on ANY failure,
# posts df + the log tail to the PR so the cause is visible without Actions-log
# access. If the runner runs out of disk/time, dispatch with a larger or
# self-hosted runner label via the `runner` input.

on:
  # PR-branch commits arrive via pull_request (one run each); push is master-only
  # so the PR branch does not double-trigger.
  push:
    branches: [master]
    paths:
      - 'zed-fork/patches/**'
      - 'zed-fork/scripts/build-lldb-ada.sh'
      - '.github/workflows/zed-lldb-ada-mac.yml'
  pull_request:
    paths:
      - 'zed-fork/patches/**'
      - 'zed-fork/scripts/build-lldb-ada.sh'
      - '.github/workflows/zed-lldb-ada-mac.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (e.g. macos-14, macos-14-xlarge, or a self-hosted label)'
        default: 'macos-14'

concurrency:
  group: lldb-ada-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # for the on-failure PR report

env:
  # Keep in sync with LLVM_REF in zed-fork/scripts/build-lldb-ada.sh.
  LLVM_REF: cd708029e0b2869e80abe31ddb175f7c35361f90

jobs:
  liblldb:
    name: Build patched liblldb (aarch64)
    runs-on: ${{ github.event.inputs.runner || 'macos-14' }}
    env:
      WORK: ${{ github.workspace }}/zed-fork/build/lldb-ada/work
      OUT: ${{ github.workspace }}/zed-fork/build/lldb-ada/liblldb
      BUILD_LOG: ${{ github.workspace }}/zed-fork/build/lldb-ada/build.log
    steps:
      - uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "arch: $(uname -m)  cpus: $(sysctl -n hw.ncpu)"
          df -h /
          echo "RAM (bytes): $(sysctl -n hw.memsize)"

      # If the patch set + pin are unchanged, restore the prebuilt dylib and
      # skip the whole build below.
      - name: Cache built liblldb
        id: liblldb-cache
        uses: actions/cache@v4
        with:
          path: zed-fork/build/lldb-ada/liblldb
          key: liblldb-ada-${{ runner.arch }}-${{ env.LLVM_REF }}-${{ hashFiles('zed-fork/patches/**', 'zed-fork/scripts/build-lldb-ada.sh') }}

      - name: Cache ccache
        if: steps.liblldb-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: lldb-ada-ccache-${{ runner.arch }}-${{ hashFiles('zed-fork/patches/**') }}
          restore-keys: lldb-ada-ccache-${{ runner.arch }}-
          save-always: true

      # One step so every command (disk reclaim, brew, cmake configure, ninja)
      # is traced into BUILD_LOG; the failure reporter then has the real error
      # regardless of which command failed.
      - name: Build liblldb
        id: build
        if: steps.liblldb-cache.outputs.cache-hit != 'true'
        env:
          TARGETS: AArch64
          LLDB_ENABLE_PYTHON: 'OFF'
          CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: '1'
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$BUILD_LOG")"
          export CCACHE_DIR="$HOME/.cache/ccache"
          {
            set -ex
            # Reclaim disk (simulators/device-support only, never the toolchain).
            df -h /
            sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* 2>/dev/null || true
            sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
            sudo rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport" 2>/dev/null || true
            xcrun simctl delete unavailable 2>/dev/null || true
            df -h /
            # Build tooling.
            brew install cmake ninja ccache
            cmake --version; ninja --version; ccache --version | head -1
            ccache --zero-stats || true
            # Patched liblldb.
            bash zed-fork/scripts/build-lldb-ada.sh
            ccache --show-stats || true
            # Keep only the dylib; drop the ~18 GB build tree before cache/upload.
            mkdir -p "$OUT"
            cp -a "$WORK"/build/lib/liblldb*.dylib "$OUT"/
            rm -rf "$WORK"
            ls -la "$OUT"
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### liblldb build failed — \`aarch64\` (${{ github.event_name }})"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Disk now:"
            echo '```'
            df -h /
            echo '```'
            echo "Last 250 lines of build log:"
            echo '```'
            tail -n 250 "$BUILD_LOG" 2>/dev/null || echo "(no build log captured — failed before the build step)"
            echo '```'
          } > /tmp/lldb-fail.md
          cat /tmp/lldb-fail.md
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
                          --head "${{ github.ref_name }}" \
                          --state open --json number --jq '.[0].number // empty')
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/lldb-fail.md
            echo "Posted failure to PR #$PR_NUMBER"
          else
            echo "No open PR for ${{ github.ref_name }}; skipping comment"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-ada-build-log
          path: zed-fork/build/lldb-ada/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload liblldb
        if: steps.liblldb-cache.outputs.cache-hit == 'true' || steps.build.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: liblldb-ada-aarch64
          path: zed-fork/build/lldb-ada/liblldb/*
          if-no-files-found: error
          retention-days: 14
