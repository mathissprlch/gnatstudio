name = "Ada"
grammar = "ada"
path_suffixes = ["ada", "adb", "ads", "ada.in", "adb.in", "ads.in"]
line_comments = ["-- "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
# ALS is the source of truth for navigation, completion, formatting.
formatter = { language_server = { name = "ada_language_server" } }
tab_size = 3
hard_tabs = false
preferred_line_length = 79
